# fork-flow CI gate: the server-side backstop for the client-side hooks.
#
# The fork hooks run ./.fork/check.sh locally (.fork/hooks), but hooks are per clone and can be
# skipped (--no-verify, a clone that never ran ./.fork/setup.sh). This
# workflow runs the same ./.fork/check.sh (every ledger Verify plus the merge=ours pin
# check) on every push and PR to custom/main, so nothing lands past a broken ledger.
# Verifies are install-free presence checks; lint and tests run elsewhere.
#
# A branch ruleset on custom/main may require the check named `registry-gate`: that is the job id
# below (it has no `name:`). Changing the id or adding a `name:` renames the check
# and blocks every merge and every land.
name: fork-flow gate
on:
  push:
    branches: [custom/main]
  pull_request:
    branches: [custom/main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  registry-gate: # required check name; keep the id and add no name:
    runs-on: ubuntu-latest
    env:
      # PR github.sha is the synthetic merge; landing is bound to the immutable head.
      FORK_FLOW_EXPECTED_SHA: ${{ github.event_name != 'pull_request' && github.sha || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.FORK_FLOW_EXPECTED_SHA }}
      - name: verify checkout identity
        run: |
          actual_sha="$(git rev-parse HEAD)"
          printf 'fork-flow expected SHA: %s\nfork-flow actual SHA: %s\n' "$FORK_FLOW_EXPECTED_SHA" "$actual_sha"
          if [ -z "$FORK_FLOW_EXPECTED_SHA" ] || [ "$actual_sha" != "$FORK_FLOW_EXPECTED_SHA" ]; then
            echo "::error::fork-flow checkout identity mismatch"
            exit 1
          fi
      - name: fork-flow gate
        run: ./.fork/check.sh
